openapi: 3.0.3
info:
  title: Logistics Management System Backend API
  version: 0.3.0
  description: |
    Backend contract owned by XIE Jiayan. Persists against schema v1.1
    (`users`, `hubs`, `items`, `shipments`, `shipment_items`, `tracking_events`).
    Authentication reads SQLite users with salted PBKDF2-SHA256 password hashes.
    Startup adds demo/demo123 if that account is missing, without replacing an
    existing password. Tokens are process-local and expire on server restart.
    Creating a shipment deducts `items.stock_quantity` and writes one
    `shipment_items` row plus a pending tracking event. Status updates also
    append a tracking event. Event posts are append-only and do not change
    `shipments.status`.
servers:
  - url: http://localhost:8000
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Public process health check
      responses:
        '200':
          description: Backend is running
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  service:
                    type: string
                    enum: [lms-backend]
  /api/auth/login:
    post:
      operationId: login
      summary: Authenticate a SQLite user and obtain a bearer token
      description: Validates the users.password_hash and returns the user's identity. Placeholder seed hashes cannot be used for login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 1
                  example: demo
                password:
                  type: string
                  minLength: 1
                  example: demo123
      responses:
        '200':
          description: Logged in; token is valid until process restart
          content:
            application/json:
              schema:
                type: object
                required: [token, token_type, user]
                properties:
                  token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/auth/profile:
    get:
      operationId: getProfile
      summary: Get the current SQLite user for a bearer token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user's public identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/shipments:
    get:
      operationId: listShipments
      summary: List persisted shipments in id order
      description: Includes sender usernames, receiver details, UTC SQLite timestamps and all shipment_items joined to the item catalogue. Orders and waybills in the frontend use this same list.
      responses:
        '200':
          description: Shipments, including the schema seed row
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shipment'
    post:
      operationId: createShipment
      summary: Create a pending shipment and atomically deduct item stock
      description: |
        Matches `items.sku`, deducts `items.stock_quantity`, inserts
        `shipments`, `shipment_items` and a pending `tracking_events` row.
        Tracking numbers are generated as HK plus UTC date plus a sequence.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sender_id, receiver_name, receiver_phone, delivery_address, sku, quantity]
              properties:
                sender_id:
                  type: integer
                  minimum: 1
                  maximum: 9223372036854775807
                  description: Existing users.user_id
                  example: 2
                receiver_name:
                  type: string
                  minLength: 1
                  example: Mary Wong
                receiver_phone:
                  type: string
                  minLength: 1
                  example: '+852-91112222'
                delivery_address:
                  type: string
                  minLength: 1
                  example: Flat A, 8/F, Harbour View, Wan Chai
                sku:
                  type: string
                  minLength: 1
                  description: Trimmed text matched exactly to items.sku
                  example: TECH-WM-001
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 9223372036854775807
                  description: Amount deducted from items.stock_quantity
                  example: 2
      responses:
        '201':
          description: Shipment created and inventory committed in one transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Sender or item does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Insufficient inventory; neither stock nor shipments changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/shipments/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    post:
      operationId: appendTrackingEvent
      summary: Append a tracking timeline event
      description: |
        Inserts an append-only `tracking_events` row. Does not change
        `shipments.status`. `hub_id` may be null when the event is not hub-local.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hub_id, status, description]
              properties:
                hub_id:
                  type: integer
                  nullable: true
                  minimum: 1
                  maximum: 9223372036854775807
                  description: Existing hubs.hub_id, or null
                  example: 1
                status:
                  type: string
                  enum: [pending, shipped, delivered]
                description:
                  type: string
                  minLength: 1
                  example: Parcel picked up and arrived at Kowloon Sorting Center.
      responses:
        '200':
          description: Tracking event inserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/shipments/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ShipmentId'
    patch:
      operationId: updateShipmentStatus
      summary: Update shipments.status
      description: Refreshes shipments.updated_at and appends a tracking event describing the status change.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, shipped, delivered]
      responses:
        '200':
          description: Updated shipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/items:
    get:
      operationId: listItems
      summary: List item catalogue rows in id order
      responses:
        '200':
          description: Current persisted items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque process-local demo token from POST /api/auth/login
  parameters:
    ShipmentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 9223372036854775807
      description: Existing shipments.shipment_id
  schemas:
    User:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: integer
          description: users.user_id; used as sender_id when creating a waybill
        username:
          type: string
        role:
          type: string
          enum: [customer, courier, warehouse_admin, admin]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Shipment:
      type: object
      required: [id, tracking_number, sender_id, sender, receiver_name, receiver_phone, delivery_address, status, created_at, updated_at, items]
      properties:
        id:
          type: integer
          description: shipments.shipment_id
        tracking_number:
          type: string
          description: shipments.tracking_number
        sender:
          type: string
          nullable: true
          description: users.username for sender_id
        sender_id:
          type: integer
        receiver_phone:
          type: string
        delivery_address:
          type: string
        created_at:
          type: string
          description: UTC SQLite timestamp, YYYY-MM-DD HH:mm:ss
        updated_at:
          type: string
          description: UTC SQLite timestamp, YYYY-MM-DD HH:mm:ss
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentItem'
        receiver_name:
          type: string
          description: shipments.receiver_name
        status:
          type: string
          enum: [pending, shipped, delivered]
    ShipmentItem:
      type: object
      required: [item_id, sku, item_name, quantity]
      properties:
        item_id:
          type: integer
        sku:
          type: string
          nullable: true
        item_name:
          type: string
        quantity:
          type: integer
    Item:
      type: object
      required: [id, item_name, sku, stock_quantity, unit_price]
      properties:
        id:
          type: integer
          description: items.item_id
        item_name:
          type: string
        sku:
          type: string
          nullable: true
        stock_quantity:
          type: integer
        unit_price:
          type: number
    TrackingEvent:
      type: object
      required: [id, shipment_id, hub_id, status, description, event_time]
      properties:
        id:
          type: integer
          description: tracking_events.event_id
        shipment_id:
          type: integer
        hub_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [pending, shipped, delivered]
        description:
          type: string
        event_time:
          type: string
  responses:
    BadRequest:
      description: Invalid JSON, missing/unknown fields, or invalid field values
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Invalid login credentials or missing/invalid bearer token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Shipment, hub or route does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: JSON body exceeds 65536 bytes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Request Content-Type must be application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
